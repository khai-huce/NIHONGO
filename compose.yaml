name: nihongo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: nihongo_local_only
      POSTGRES_DB: nihongo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nihongo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihongo -d nihongo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nihongo_pgdata:
