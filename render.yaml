services:
  - type: web
    name: nihongo-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: https://nihongo-learner-web.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GOOGLE_CLIENT_ID
        value: 227532259055-b6gj3mgqu6nild4odmhm19491r0rksrf.apps.googleusercontent.com
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: ASSISTANT_GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: READING_QUIZ_GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: SHADOWING_GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_API_KEY
        sync: false
